name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group:
    ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.13.1
          run_install: false

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and DOM tests
        run: pnpm test

      - name: Detector performance tests
        run: pnpm test:performance

      - name: Clean prior build output
        run: rm -rf apps/extension/dist

      - name: Build production extension
        run: pnpm build

      - name: Verify production artifact security
        run: pnpm verify:artifact

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser integration tests
        run: pnpm test:e2e

      - name: Upload verified extension
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-dlp-extension-${{ github.sha }}
          path: apps/extension/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            artifacts/playwright/**/trace.zip
            artifacts/playwright/**/*.png
            artifacts/playwright/**/error-context.md
          if-no-files-found: ignore
          retention-days: 3
